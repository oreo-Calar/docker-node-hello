# supervisord 是守护进程，以非 root 用户运行，前台模式适配 Docker 容器
[supervisord]
nodaemon=true
user=node

# Unix domain socket，解决 node 用户权限问题，仅 owner 可读写（最小权限）
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

# supervisorctl 通过 socket 连接 supervisord，路径与上面保持一致
[supervisorctl]
serverurl=unix:///tmp/supervisor.sock